<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8ec" />
  <title>軟冰淇淋模擬器 | Soft Serve Simulator</title>
  <meta name="description" content="可選顏色的 3D 軟冰淇淋模擬器。移動甜筒、按住擠冰淇淋，挑戰最高高度！" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff8ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      color: #2c3e50;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }

    #ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .height-display {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 12px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      min-width: 120px;
    }

    .height-display .label {
      font-size: 12px;
      color: #7f8c8d;
      letter-spacing: 0.5px;
    }

    .height-display .value {
      font-size: 28px;
      font-weight: 700;
      color: #2c3e50;
      line-height: 1.2;
    }

    .height-display .best {
      font-size: 12px;
      color: #e67e22;
      margin-top: 2px;
    }

    .color-panel {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 12px 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      pointer-events: auto;
    }

    .color-panel .title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
      text-align: center;
      color: #34495e;
    }

    .colors {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 160px;
    }

    .color-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .color-btn:hover {
      transform: scale(1.12);
    }

    .color-btn.active {
      border-color: #2c3e50;
      transform: scale(1.15);
    }

    .color-btn.custom {
      background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
    }

    .bottom-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      pointer-events: auto;
    }

    button.action {
      background: #2c3e50;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transition: transform 0.1s, background 0.2s;
    }

    button.action:active {
      transform: scale(0.96);
    }

    button.action.secondary {
      background: #ecf0f1;
      color: #2c3e50;
    }

    button.action.primary {
      background: #e67e22;
    }

    .hint {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(44, 62, 80, 0.85);
      color: white;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 14px;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.5s;
      white-space: nowrap;
    }

    .hint.hidden {
      opacity: 0;
    }

    #result-modal {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 20;
    }

    #result-modal.show {
      display: flex;
    }

    .modal-card {
      background: white;
      border-radius: 24px;
      padding: 32px 28px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    .modal-card h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .modal-card .final-height {
      font-size: 42px;
      font-weight: 800;
      color: #e67e22;
      margin: 12px 0;
    }

    .modal-card .new-record {
      color: #27ae60;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
    }

    .modal-card .new-record.show {
      display: block;
    }

    .game-title {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 15px;
      font-weight: 600;
      color: #95a5a6;
      letter-spacing: 1px;
      pointer-events: none;
      opacity: 0.7;
    }

    #portrait-tip {
      display: none;
      position: absolute;
      inset: 0;
      background: #fff8ec;
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 18px;
      color: #2c3e50;
    }

    @media (orientation: landscape) and (max-height: 500px) {
      #portrait-tip {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui">
    <div class="top-bar">
      <div class="height-display">
        <div class="label">目前高度</div>
        <div class="value" id="height-value">0.0 <small>cm</small></div>
        <div class="best">最高紀錄：<span id="best-value">0.0</span> cm</div>
      </div>

      <div class="color-panel">
        <div class="title">冰淇淋顏色</div>
        <div class="colors" id="color-buttons"></div>
      </div>
    </div>

    <div class="hint" id="hint">移動甜筒 → 按住擠冰淇淋</div>

    <div class="bottom-bar">
      <button class="action secondary" id="btn-reset">重新開始</button>
      <button class="action primary" id="btn-finish">完成！</button>
    </div>
  </div>

  <div class="game-title">SOFT SERVE SIMULATOR</div>

  <div id="result-modal">
    <div class="modal-card">
      <h2>完成！</h2>
      <div class="final-height" id="final-height">0.0 cm</div>
      <div class="new-record" id="new-record">🎉 新紀錄！</div>
      <button class="action primary" id="btn-again" style="margin-top: 12px; width: 100%;">再玩一次</button>
    </div>
  </div>

  <div id="portrait-tip">
    <p>請將手機直立<br/>以獲得最佳體驗 🍦</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const COLORS = [
      { name: '香草', hex: 0xf5e6c8 },
      { name: '巧克力', hex: 0x5c3a21 },
      { name: '草莓', hex: 0xf8a5c2 },
      { name: '抹茶', hex: 0x8fbc8f },
      { name: '藍莓', hex: 0x6b5b95 },
      { name: '芒果', hex: 0xffb347 },
      { name: '自訂', hex: 0xffffff, custom: true }
    ];

    let currentColor = COLORS[0].hex;
    let height = 0;
    let bestHeight = parseFloat(localStorage.getItem('softserve-best') || '0');
    let isDispensing = false;
    let gameActive = true;

    const heightValueEl = document.getElementById('height-value');
    const bestValueEl = document.getElementById('best-value');
    const hintEl = document.getElementById('hint');
    const resultModal = document.getElementById('result-modal');
    const finalHeightEl = document.getElementById('final-height');
    const newRecordEl = document.getElementById('new-record');
    const colorButtonsEl = document.getElementById('color-buttons');

    bestValueEl.textContent = bestHeight.toFixed(1);

    COLORS.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.className = 'color-btn' + (c.custom ? ' custom' : '');
      if (!c.custom) btn.style.background = `#${c.hex.toString(16).padStart(6, '0')}`;
      btn.title = c.name;
      if (i === 0) btn.classList.add('active');
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (c.custom) {
          const input = document.createElement('input');
          input.type = 'color';
          input.value = '#' + currentColor.toString(16).padStart(6, '0');
          input.addEventListener('input', (e) => {
            currentColor = parseInt(e.target.value.slice(1), 16);
            updateIceCreamMaterial();
          });
          input.click();
        } else {
          currentColor = c.hex;
          updateIceCreamMaterial();
        }
      });
      colorButtonsEl.appendChild(btn);
    });

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfff8ec);
    scene.fog = new THREE.Fog(0xfff8ec, 8, 18);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.5, 7);
    camera.lookAt(0, 1.8, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(4, 10, 6);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const fill = new THREE.DirectionalLight(0xffe0b2, 0.35);
    fill.position.set(-3, 4, -2);
    scene.add(fill);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(6, 64),
      new THREE.MeshStandardMaterial({ color: 0xf0e6d2, roughness: 0.85 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Nozzle
    const nozzleGroup = new THREE.Group();
    nozzleGroup.position.set(0, 4.2, 0);

    const nozzleBody = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.22, 0.5, 16),
      new THREE.MeshStandardMaterial({ color: 0x4a5568, metalness: 0.4, roughness: 0.35 })
    );
    nozzleBody.position.y = 0.25;
    nozzleGroup.add(nozzleBody);

    const nozzleTip = new THREE.Mesh(
      new THREE.CylinderGeometry(0.07, 0.12, 0.25, 16),
      new THREE.MeshStandardMaterial({ color: 0x2d3748, metalness: 0.5, roughness: 0.3 })
    );
    nozzleTip.position.y = -0.1;
    nozzleGroup.add(nozzleTip);
    scene.add(nozzleGroup);

    // Cone
    const coneGroup = new THREE.Group();
    coneGroup.position.set(0, 0.05, 0);

    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(0.45, 1.4, 24, 1, true),
      new THREE.MeshStandardMaterial({ color: 0xd4a574, roughness: 0.7, side: THREE.DoubleSide })
    );
    cone.position.y = 0.7;
    cone.rotation.x = Math.PI;
    cone.castShadow = true;
    coneGroup.add(cone);

    const innerCone = new THREE.Mesh(
      new THREE.ConeGeometry(0.42, 1.35, 24, 1, true),
      new THREE.MeshStandardMaterial({ color: 0xc48a5a, side: THREE.BackSide })
    );
    innerCone.position.y = 0.7;
    innerCone.rotation.x = Math.PI;
    coneGroup.add(innerCone);
    scene.add(coneGroup);

    let iceCreamMesh = null;
    const iceCreamMat = new THREE.MeshStandardMaterial({
      color: currentColor,
      roughness: 0.55,
      metalness: 0.05
    });

    function updateIceCreamMaterial() {
      iceCreamMat.color.setHex(currentColor);
    }

    function createSwirlGeometry(heightCm) {
      const h = Math.max(0.05, heightCm * 0.045);
      const points = [];
      const turns = 4 + heightCm * 0.08;
      const segments = Math.max(40, Math.floor(heightCm * 6));

      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const y = t * h;
        const radius = 0.32 * (1 - t * 0.55) + 0.06;
        const angle = t * turns * Math.PI * 2;
        const swirlOffset = 0.08 * Math.sin(t * Math.PI * 8);
        const x = Math.cos(angle) * (radius + swirlOffset * 0.3);
        const z = Math.sin(angle) * (radius + swirlOffset * 0.3);
        points.push(new THREE.Vector3(x, y, z));
      }

      const curve = new THREE.CatmullRomCurve3(points);
      return new THREE.TubeGeometry(curve, segments, 0.13 * (1 - heightCm * 0.0015), 12, false);
    }

    function updateIceCream(heightCm) {
      if (iceCreamMesh) {
        coneGroup.remove(iceCreamMesh);
        iceCreamMesh.geometry.dispose();
        iceCreamMesh = null;
      }
      if (heightCm < 0.3) return;

      const geo = createSwirlGeometry(heightCm);
      iceCreamMesh = new THREE.Mesh(geo, iceCreamMat);
      iceCreamMesh.position.y = 1.35;
      iceCreamMesh.castShadow = true;
      coneGroup.add(iceCreamMesh);
    }

    const mouse = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();
    let targetX = 0;
    let targetZ = 0;

    function updatePointer(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      const intersect = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(plane, intersect)) {
        targetX = THREE.MathUtils.clamp(intersect.x, -2.2, 2.2);
        targetZ = THREE.MathUtils.clamp(intersect.z, -1.8, 1.8);
      }
    }

    window.addEventListener('pointermove', (e) => {
      if (!gameActive) return;
      updatePointer(e.clientX, e.clientY);
    });

    window.addEventListener('pointerdown', (e) => {
      if (!gameActive) return;
      if (e.target.closest('button') || e.target.closest('.color-panel')) return;
      isDispensing = true;
      updatePointer(e.clientX, e.clientY);
      hintEl.classList.add('hidden');
    });

    window.addEventListener('pointerup', () => { isDispensing = false; });
    window.addEventListener('pointerleave', () => { isDispensing = false; });

    document.getElementById('btn-reset').addEventListener('click', resetGame);
    document.getElementById('btn-finish').addEventListener('click', finishGame);
    document.getElementById('btn-again').addEventListener('click', () => {
      resultModal.classList.remove('show');
      resetGame();
    });

    function resetGame() {
      height = 0;
      gameActive = true;
      isDispensing = false;
      updateIceCream(0);
      heightValueEl.innerHTML = `0.0 <small>cm</small>`;
      hintEl.classList.remove('hidden');
      coneGroup.position.set(0, 0.05, 0);
      targetX = 0;
      targetZ = 0;
    }

    function finishGame() {
      gameActive = false;
      isDispensing = false;
      finalHeightEl.textContent = height.toFixed(1) + ' cm';
      if (height > bestHeight) {
        bestHeight = height;
        localStorage.setItem('softserve-best', bestHeight.toFixed(1));
        bestValueEl.textContent = bestHeight.toFixed(1);
        newRecordEl.classList.add('show');
      } else {
        newRecordEl.classList.remove('show');
      }
      resultModal.classList.add('show');
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      coneGroup.position.x += (targetX - coneGroup.position.x) * 0.18;
      coneGroup.position.z += (targetZ - coneGroup.position.z) * 0.18;

      if (isDispensing && gameActive) {
        const dx = coneGroup.position.x - nozzleGroup.position.x;
        const dz = coneGroup.position.z - nozzleGroup.position.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        if (dist < 0.55) {
          const factor = 1 - (dist / 0.55);
          height += 8.5 * factor * dt;
          if (height > 120) height = 120;
          heightValueEl.innerHTML = `${height.toFixed(1)} <small>cm</small>`;
          updateIceCream(height);
        }
      }

      nozzleGroup.position.y = 4.2 + Math.sin(clock.elapsedTime * 1.5) * 0.03;
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
