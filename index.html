    * {
      margin: 0;
      padding: 0;

    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff8ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      color: #2c3e50;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }

    /* UI Overlay */
    #ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .height-display {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 12px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      min-width: 120px;
    }

    .height-display .label {
      font-size: 12px;
      color: #7f8c8d;
      letter-spacing: 0.5px;
    }

    .height-display .value {
      font-size: 28px;
      font-weight: 700;
      color: #2c3e50;
      line-height: 1.2;
    }

    .height-display .best {
      font-size: 12px;
      color: #e67e22;
      margin-top: 2px;
    }

    /* Color Picker */
    .color-panel {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 12px 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      pointer-events: auto;
    }

    .color-panel .title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
      text-align: center;
      color: #34495e;
    }

    .colors {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 160px;
    }

    .color-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .color-btn:hover {
      transform: scale(1.12);
    }

    .color-btn.active {
      border-color: #2c3e50;
      transform: scale(1.15);
    }

    .color-btn.custom {
      background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
    }

    /* Bottom controls */
    .bottom-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      pointer-events: auto;
    }

    button.action {
      background: #2c3e50;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transition: transform 0.1s, background 0.2s;
    }

    button.action:active {
      transform: scale(0.96);
    }

    button.action.secondary {
      background: #ecf0f1;
      color: #2c3e50;
    }

    button.action.primary {
      background: #e67e22;
    }
