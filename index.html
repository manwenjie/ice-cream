<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ec">
  <title>軟冰淇淋模擬器 Pro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff8ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      color: #2c3e50;
    }
    #canvas-box {
      position: absolute;
      inset: 0;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }
    #ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      padding-top: max(14px, env(safe-area-inset-top));
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .card {
      background: rgba(255,255,255,0.93);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }
    .h-label { font-size: 11px; color: #7f8c8d; }
    .h-val { font-size: 26px; font-weight: 700; line-height: 1.15; }
    .h-best { font-size: 11px; color: #e67e22; margin-top: 2px; }
    .flavors {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      max-width: 168px;
    }
    .f-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      cursor: pointer;
      position: relative;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      pointer-events: auto;
    }
    .f-btn.active {
      border-color: #2c3e50;
      transform: scale(1.13);
    }
    .f-btn span {
      position: absolute;
      bottom: -17px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      white-space: nowrap;
      opacity: 0;
      transition: 0.15s;
      color: #444;
      pointer-events: none;
    }
    .f-btn.active span,
    .f-btn:hover span {
      opacity: 1;
    }
    .bal-wrap {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      width: 170px;
      pointer-events: none;
    }
    .bal-bg {
      height: 7px;
      background: rgba(0,0,0,0.08);
      border-radius: 10px;
      overflow: hidden;
    }
    .bal-fill {
      height: 100%;
      width: 50%;
      background: #27ae60;
      border-radius: 10px;
      transition: background 0.15s;
    }
    .bal-label {
      text-align: center;
      font-size: 10px;
      color: #95a5a6;
      margin-top: 3px;
    }
    .hint {
      position: absolute;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(44,62,80,0.88);
      color: #fff;
      padding: 9px 16px;
      border-radius: 30px;
      font-size: 13px;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.4s;
    }
    .hint.hide { opacity: 0; }
    .bot {
      display: flex;
      justify-content: center;
      gap: 10px;
      pointer-events: auto;
    }
    .btn {
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.16);
    }
    .btn-s { background: #ecf0f1; color: #2c3e50; }
    .btn-p { background: #e67e22; color: #fff; }
    .title {
