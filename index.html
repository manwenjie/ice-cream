<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8ec" />
  <title>軟冰淇淋模擬器 | Soft Serve Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff8ec; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif; color: #2c3e50; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; }
    canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
    #ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: max(14px, env(safe-area-inset-bottom)); }
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .height-display { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border-radius: 16px; padding: 10px 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); text-align: center; min-width: 105px; }
    .height-display .label { font-size: 11px; color: #7f8c8d; }
    .height-display .value { font-size: 24px; font-weight: 700; line-height: 1.2; }
    .height-display .best { font-size: 11px; color: #e67e22; margin-top: 2px; }
    .color-panel { background: rgba(255,255,255,0.94); backdrop-filter: blur(10px); border-radius: 16px; padding: 10px 12px; box-shadow: 0 4px 18px rgba(0,0,0,0.1); pointer-events: auto; max-width: 170px; }
    .color-panel .title { font-size: 12px; font-weight: 600; margin-bottom: 8px; text-align: center; }
    .colors { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .color-btn { width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid transparent; cursor: pointer; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
    .color-btn.active { border-color: #2c3e50; transform: scale(1.12); }
    .color-btn .flavor-name { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; white-space: nowrap; color: #555; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .color-btn:hover .flavor-name, .color-btn.active .flavor-name { opacity: 1; }
    .bottom-bar { display: flex; justify-content: center; gap: 10px; pointer-events: auto; }
    button.action { background: #2c3e50; color: white; border: none; border-radius: 50px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
    button.action.secondary { background: #ecf0f1; color: #2c3e50; }
    button.action.primary { background: #e67e22; }
    .hint { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(44,62,80,0.88); color: white; padding: 9px 16px; border-radius: 30px; font-size: 13px; pointer-events: none; white-space: nowrap; transition: opacity 0.4s; }
    .hint.hidden { opacity: 0; }
    #result-modal { position: absolute; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; pointer-events: auto; z-index: 30; }
    #result-modal.show { display: flex; }
    .modal-card { background: white; border-radius: 22px; padding: 28px 24px; text-align: center; max-width: 300px; width: 90%; box-shadow: 0 16px 50px rgba(0,0,0,0.25); }
    .modal-card h2 { font-size: 20px; margin-bottom: 6px; }
    .modal-card .final-height { font-size: 38px; font-weight: 800; color: #e67e22; margin: 10px 0; }
    .modal-card .new-record { color: #27ae60; font-weight: 600; margin-bottom: 12px; display: none; }
    .modal-card .new-record.show { display: block; }
    .game-title { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 600; color: #95a5a6; letter-spacing: 1px; pointer-events: none; opacity: 0.7; }
    #error-box { display: none; position: absolute; inset: 0; background: #fff8ec; z-index: 50; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; }
    #error-box.show { display: flex; }
    .balance-bar { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); width: 160px; height: 8px; background: rgba(0,0,0,0.08); border-radius: 10px; overflow: hidden; pointer-events: none; }
    .balance-fill { height: 100%; width: 50%; background: #27ae60; border-radius: 10px; transition: background 0.2s; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui">
    <div class="top-bar">
      <div class="height-display">
        <div class="label">目前高度</div>
        <div class="value" id="height-value">0.0 <small>cm</small></div>
        <div class="best">最高紀錄：<span id="best-value">0.0</span> cm</div>
      </div>
      <div class="color-panel">
        <div class="title">選擇口味</div>
        <div class="colors" id="color-buttons"></div>
      </div>
    </div>

    <div class="balance-bar"><div class="balance-fill" id="balance-fill"></div></div>

    <div class="hint" id="hint">移動甜筒對準管子 → 按住擠冰淇淋</div>
    <div class="bottom-bar">
      <button class="action secondary" id="btn-reset">重新開始</button>
      <button class="action primary" id="btn-finish">完成！</button>
    </div>
  </div>

  <div class="game-title">SOFT SERVE SIMULATOR</div>

  <div id="result-modal">
    <div class="modal-card">
      <h2 id="result-title">完成！</h2>
      <div class="final-height" id="final-height">0.0 cm</div>
      <div class="new-record" id="new-record">🎉 新紀錄！</div>
      <p id="result-msg" style="font-size:13px;color:#7f8c8d;margin-bottom:14px;"></p>
      <button class="action primary" id="btn-again" style="width:100%;">再玩一次</button>
    </div>
  </div>

  <div id="error-box">
    <h2>無法啟動 3D 畫面</h2>
    <p>請改用 Chrome 或 Safari，並確認已開啟硬體加速。</p>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    (function () {
      function checkWebGL() {
        try {
          const c = document.createElement('canvas');
          return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
        } catch (e) { return false; }
      }
      if (!checkWebGL() || typeof THREE === 'undefined') {
        document.getElementById('error-box').classList.add('show');
        return;
      }

      // ===== 口味設定 =====
      const FLAVORS = [
        { name: '香草',   hex: 0xf5e6c8 },
        { name: '巧克力', hex: 0x5c3a21 },
        { name: '草莓',   hex: 0xf8a5c2 },
        { name: '抹茶',   hex: 0x7d9b76 },
        { name: '火龍果', hex: 0xe85a71 },
        { name: '芒果',   hex: 0xffb347 },
        { name: '藍莓',   hex: 0x6b5b95 },
        { name: '芝麻',   hex: 0x4a4a4a }
      ];

      let currentColor = FLAVORS[0].hex;
      let height = 0;
      let bestHeight = parseFloat(localStorage.getItem('softserve-best') || '0');
      let isDispensing = false;
      let gameActive = true;
      let isFalling = false;
      let targetX = 0, targetZ = 0;
      let balanceOffset = 0;   // 正負代表左右傾斜
      let fallVelocity = 0;
      let fallRotation = 0;

      const heightValueEl = document.getElementById('height-value');
      const bestValueEl = document.getElementById('best-value');
      const hintEl = document.getElementById('hint');
      const resultModal = document.getElementById('result-modal');
      const finalHeightEl = document.getElementById('final-height');
      const newRecordEl = document.getElementById('new-record');
      const resultTitle = document.getElementById('result-title');
      const resultMsg = document.getElementById('result-msg');
      const colorButtonsEl = document.getElementById('color-buttons');
      const balanceFill = document.getElementById('balance-fill');

      bestValueEl.textContent = bestHeight.toFixed(1);

      // 建立口味按鈕
      FLAVORS.forEach((f, i) => {
        const btn = document.createElement('button');
        btn.className = 'color-btn';
        btn.style.background = '#' + f.hex.toString(16).padStart(6, '0');
        btn.title = f.name;
        const label = document.createElement('span');
        label.className = 'flavor-name';
        label.textContent = f.name;
        btn.appendChild(label);
        if (i === 0) btn.classList.add('active');
        btn.addEventListener('click', () => {
          document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentColor = f.hex;
          iceCreamMat.color.setHex(currentColor);
          streamMat.color.setHex(currentColor);
        });
        colorButtonsEl.appendChild(btn);
      });

      // ===== Three.js =====
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xfff8ec);
      scene.fog = new THREE.Fog(0xfff8ec, 9, 18);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 3.8, 7.2);
      camera.lookAt(0, 1.9, 0);

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);
      } catch (e) {
        document.getElementById('error-box').classList.add('show');
        return;
      }

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(4, 10, 6);
      dirLight.castShadow = true;
      scene.add(dirLight);
      scene.add(new THREE.DirectionalLight(0xffe0b2, 0.3).position.set(-3, 4, -2));

      // 地面
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(6, 64),
        new THREE.MeshStandardMaterial({ color: 0xf0e6d2, roughness: 0.85 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // ===== 噴嘴（管子） =====
      const nozzleGroup = new THREE.Group();
      nozzleGroup.position.set(0, 4.35, 0);

      const pipe = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.20, 0.7, 16),
        new THREE.MeshStandardMaterial({ color: 0x4a5568, metalness: 0.45, roughness: 0.3 })
      );
      pipe.position.y = 0.35;
      nozzleGroup.add(pipe);

      const tip = new THREE.Mesh(
        new THREE.CylinderGeometry(0.06, 0.11, 0.28, 16),
        new THREE.MeshStandardMaterial({ color: 0x2d3748, metalness: 0.5, roughness: 0.25 })
      );
      tip.position.y = -0.12;
      nozzleGroup.add(tip);
      scene.add(nozzleGroup);

      // ===== 甜筒 =====
      const coneGroup = new THREE.Group();
      coneGroup.position.set(0, 0.05, 0);

      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(0.48, 1.45, 24, 1, true),
        new THREE.MeshStandardMaterial({ color: 0xd4a574, roughness: 0.7, side: THREE.DoubleSide })
      );
      cone.position.y = 0.72;
      cone.rotation.x = Math.PI;
      cone.castShadow = true;
      coneGroup.add(cone);

      const inner = new THREE.Mesh(
        new THREE.ConeGeometry(0.45, 1.4, 24, 1, true),
        new THREE.MeshStandardMaterial({ color: 0xc48a5a, side: THREE.BackSide })
      );
      inner.position.y = 0.72;
      inner.rotation.x = Math.PI;
      coneGroup.add(inner);
      scene.add(coneGroup);

      // ===== 冰淇淋本體 =====
      let iceCreamMesh = null;
      const iceCreamMat = new THREE.MeshStandardMaterial({ color: currentColor, roughness: 0.55, metalness: 0.05 });

      // 從管子掉下來的「流動中」冰淇淋
      const streamMat = new THREE.MeshStandardMaterial({ color: currentColor, roughness: 0.5, metalness: 0.05 });
      const stream = new THREE.Mesh(
        new THREE.CylinderGeometry(0.07, 0.09, 0.01, 10),
        streamMat
      );
      stream.visible = false;
      scene.add(stream);

      function createSwirlGeometry(hCm, tilt = 0) {
        const h = Math.max(0.08, hCm * 0.048);
        const points = [];
        const turns = 3.8 + hCm * 0.07;
        const segs = Math.max(36, Math.floor(hCm * 5.5));
        for (let i = 0; i <= segs; i++) {
          const t = i / segs;
          const y = t * h;
          const radius = 0.34 * (1 - t * 0.52) + 0.07;
          const angle = t * turns * Math.PI * 2;
          const swirl = 0.07 * Math.sin(t * Math.PI * 7);
          // 加入傾斜影響
          const x = Math.cos(angle) * (radius + swirl * 0.25) + tilt * t * 0.35;
          const z = Math.sin(angle) * (radius + swirl * 0.25);
          points.push(new THREE.Vector3(x, y, z));
        }
        const curve = new THREE.CatmullRomCurve3(points);
        return new THREE.TubeGeometry(curve, segs, 0.125 * (1 - hCm * 0.0012), 10, false);
      }

      function updateIceCream() {
        if (iceCreamMesh) {
          coneGroup.remove(iceCreamMesh);
          iceCreamMesh.geometry.dispose();
          iceCreamMesh = null;
        }
        if (height < 0.4) return;
        iceCreamMesh = new THREE.Mesh(createSwirlGeometry(height, balanceOffset), iceCreamMat);
        iceCreamMesh.position.y = 1.38;
        iceCreamMesh.castShadow = true;
        coneGroup.add(iceCreamMesh);
      }

      // ===== 輸入 =====
      const mouse = new THREE.Vector2();
      const raycaster = new THREE.Raycaster();

      function updatePointer(cx, cy) {
        mouse.x = (cx / window.innerWidth) * 2 - 1;
        mouse.y = -(cy / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const hit = new THREE.Vector3();
        if (raycaster.ray.intersectPlane(plane, hit)) {
          targetX = THREE.MathUtils.clamp(hit.x, -2.3, 2.3);
          targetZ = THREE.MathUtils.clamp(hit.z, -1.9, 1.9);
        }
      }

      window.addEventListener('pointermove', e => {
        if (!gameActive || isFalling) return;
        updatePointer(e.clientX, e.clientY);
      });
      window.addEventListener('pointerdown', e => {
        if (!gameActive || isFalling) return;
        if (e.target.closest('button') || e.target.closest('.color-panel')) return;
        isDispensing = true;
        updatePointer(e.clientX, e.clientY);
        hintEl.classList.add('hidden');
      });
      window.addEventListener('pointerup', () => { isDispensing = false; });
      window.addEventListener('pointerleave', () => { isDispensing = false; });

      document.getElementById('btn-reset').addEventListener('click', resetGame);
      document.getElementById('btn-finish').addEventListener('click', () => finishGame(false));
      document.getElementById('btn-again').addEventListener('click', () => {
        resultModal.classList.remove('show');
        resetGame();
      });

      function resetGame() {
        height = 0;
        balanceOffset = 0;
        fallVelocity = 0;
        fallRotation = 0;
        isFalling = false;
        gameActive = true;
        isDispensing = false;
        updateIceCream();
        heightValueEl.innerHTML = '0.0 <small>cm</small>';
        hintEl.classList.remove('hidden');
        coneGroup.position.set(0, 0.05, 0);
        coneGroup.rotation.set(0, 0, 0);
        targetX = 0; targetZ = 0;
        stream.visible = false;
        balanceFill.style.width = '50%';
        balanceFill.style.background = '#27ae60';
      }

      function finishGame(collapsed) {
        gameActive = false;
        isDispensing = false;
        stream.visible = false;
        finalHeightEl.textContent = height.toFixed(1) + ' cm';

        if (collapsed) {
          resultTitle.textContent = '倒塌了！';
          resultMsg.textContent = '甜筒失去平衡，冰淇淋掉下來了…';
        } else {
          resultTitle.textContent = '完成！';
          resultMsg.textContent = '';
        }

        if (height > bestHeight) {
          bestHeight = height;
          localStorage.setItem('softserve-best', bestHeight.toFixed(1));
          bestValueEl.textContent = bestHeight.toFixed(1);
          newRecordEl.classList.add('show');
        } else {
          newRecordEl.classList.remove('show');
        }
        resultModal.classList.add('show');
      }

      // ===== 主迴圈 =====
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);

        if (isFalling) {
          // 倒塌動畫
          fallVelocity += 12 * dt;
          coneGroup.position.y -= fallVelocity * dt;
          fallRotation += 2.8 * dt;
          coneGroup.rotation.z = fallRotation * Math.sign(balanceOffset || 1);
          coneGroup.rotation.x = fallRotation * 0.4;

          if (coneGroup.position.y < -2.5) {
            isFalling = false;
            finishGame(true);
          }
        } else if (gameActive) {
          // 平滑移動甜筒
          coneGroup.position.x += (targetX - coneGroup.position.x) * 0.2;
          coneGroup.position.z += (targetZ - coneGroup.position.z) * 0.2;

          // 計算與噴嘴的水平距離
          const dx = coneGroup.position.x - nozzleGroup.position.x;
          const dz = coneGroup.position.z - nozzleGroup.position.z;
          const dist = Math.sqrt(dx * dx + dz * dz);

          // 更新平衡條
          const balancePercent = Math.max(0, Math.min(100, 50 + balanceOffset * 35));
          balanceFill.style.width = balancePercent + '%';
          if (Math.abs(balanceOffset) > 0.7) balanceFill.style.background = '#e74c3c';
          else if (Math.abs(balanceOffset) > 0.4) balanceFill.style.background = '#f39c12';
          else balanceFill.style.background = '#27ae60';

          if (isDispensing) {
            // 顯示從管子掉下來的冰淇淋流
            const streamLen = Math.max(0.15, 4.1 - (1.38 + height * 0.048));
            stream.scale.y = streamLen / 0.01;
            stream.position.set(0, 4.1 - streamLen / 2, 0);
            stream.visible = true;

            if (dist < 0.62) {
              // 有接到
              const factor = 1 - (dist / 0.62);
              const grow = 7.8 * factor * dt;
              height += grow;
              if (height > 130) height = 130;

              // 平衡計算：甜筒偏離越多，offset 累積越快
              balanceOffset += dx * 0.9 * dt;
              // 高度越高越不穩
              balanceOffset *= (1 + height * 0.0008);

              heightValueEl.innerHTML = height.toFixed(1) + ' <small>cm</small>';
              updateIceCream();

              // 倒塌判定
              if (Math.abs(balanceOffset) > 1.15 || (height > 25 && Math.abs(balanceOffset) > 0.95)) {
                isFalling = true;
                isDispensing = false;
                stream.visible = false;
              }
            } else {
              // 沒對準，冰淇淋直接掉到地上（這裡只是不長高）
              // 可以加一點懲罰讓平衡更差
              balanceOffset += dx * 0.3 * dt;
            }
          } else {
            stream.visible = false;
            // 停止擠的時候，平衡會慢慢回正一點點
            balanceOffset *= 0.985;
          }

          // 讓甜筒有一點傾斜視覺回饋
          coneGroup.rotation.z = -balanceOffset * 0.25;
        }

        // 噴嘴微微晃動
        nozzleGroup.position.y = 4.35 + Math.sin(clock.elapsedTime * 1.4) * 0.025;

        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    })();
  </script>
</body>
</html>
